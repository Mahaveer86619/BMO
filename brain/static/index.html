<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BMO</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #07080f;
                --surface: #0d0e1a;
                --surf2: #13152a;
                --surf3: #1a1c33;
                --border: #1e2040;
                --border2: #252850;
                --accent: #4fffb0;
                --accent2: #00c97a;
                --accent-glow: rgba(79, 255, 176, 0.15);
                --accent-dim: rgba(79, 255, 176, 0.06);
                --text: #e4e6f3;
                --text2: #9294b0;
                --muted: #3d3f60;
                --red: #ff4d6a;
                --red-dim: rgba(255, 77, 106, 0.08);
                --amber: #ffb347;
                --amber-dim: rgba(255, 179, 71, 0.08);
                --blue: #5b8af5;
                --purple: #8b7cf8;
                --mono: "IBM Plex Mono", "Cascadia Code", monospace;
                --sans: "Inter", "Segoe UI", system-ui, sans-serif;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                height: 100dvh;
                display: grid;
                grid-template-rows: 56px 1fr 0px auto;
                overflow: hidden;
                user-select: none;
                transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            body.term-open {
                grid-template-rows: 56px 1fr 200px auto;
            }

            /* subtle scan-line texture */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.04) 2px, rgba(0, 0, 0, 0.04) 4px);
                pointer-events: none;
                z-index: 100;
            }

            /* ── HEADER ── */
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 20px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                position: relative;
                z-index: 10;
            }
            header::after {
                content: "";
                position: absolute;
                bottom: -1px;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--accent2), transparent);
                opacity: 0.3;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 700;
                font-size: 13px;
                letter-spacing: 4px;
                color: var(--accent);
                text-transform: uppercase;
            }

            .logo-icon {
                width: 28px;
                height: 28px;
                background: linear-gradient(135deg, var(--accent2), var(--accent));
                border-radius: 7px;
                display: grid;
                place-items: center;
                color: #000;
                box-shadow: 0 0 12px var(--accent-glow);
            }

            .header-right {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            #conn-badge {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 5px 12px;
                border-radius: 20px;
                background: var(--surf2);
                border: 1px solid var(--border);
                font-size: 11px;
                font-family: var(--mono);
                color: var(--muted);
                transition:
                    color 0.3s,
                    border-color 0.3s,
                    background 0.3s;
                letter-spacing: 0.5px;
            }
            #conn-badge.ok {
                color: var(--accent);
                border-color: rgba(79, 255, 176, 0.25);
                background: rgba(79, 255, 176, 0.04);
            }
            #conn-badge.err {
                color: var(--red);
                border-color: rgba(255, 77, 106, 0.25);
                background: var(--red-dim);
            }

            .cdot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: currentColor;
                flex-shrink: 0;
            }
            #conn-badge.ok .cdot {
                animation: blink 2.5s ease-in-out infinite;
            }
            @keyframes blink {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.2;
                }
            }

            /* ── CONVERSATION ── */
            #chat {
                overflow-y: auto;
                padding: 24px 20px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                scroll-behavior: smooth;
            }
            #chat::-webkit-scrollbar {
                width: 4px;
            }
            #chat::-webkit-scrollbar-track {
                background: transparent;
            }
            #chat::-webkit-scrollbar-thumb {
                background: var(--border2);
                border-radius: 2px;
            }

            #empty {
                margin: auto;
                text-align: center;
                color: var(--muted);
                font-size: 13px;
                line-height: 2.2;
                pointer-events: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .empty-icon {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                border: 1.5px solid var(--border2);
                display: grid;
                place-items: center;
                color: var(--muted);
                margin-bottom: 4px;
            }

            #empty strong {
                color: var(--text2);
                font-weight: 500;
            }

            #empty kbd {
                font-family: var(--mono);
                font-size: 10px;
                background: var(--surf2);
                border: 1px solid var(--border2);
                border-radius: 4px;
                padding: 1px 6px;
                color: var(--text2);
            }

            /* ── CHAT BUBBLES ── */
            .bubble {
                display: flex;
                flex-direction: column;
                max-width: min(72%, 520px);
                animation: pop-in 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            @keyframes pop-in {
                from {
                    opacity: 0;
                    transform: translateY(8px) scale(0.98);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }
            .bubble.you {
                align-self: flex-end;
            }
            .bubble.bmo {
                align-self: flex-start;
            }

            .blabel {
                font-size: 9px;
                font-weight: 600;
                font-family: var(--mono);
                letter-spacing: 2px;
                text-transform: uppercase;
                margin-bottom: 6px;
                padding: 0 4px;
            }
            .bubble.you .blabel {
                color: var(--muted);
                text-align: right;
            }
            .bubble.bmo .blabel {
                color: var(--accent2);
            }

            .bbody {
                padding: 11px 15px;
                font-size: 14px;
                line-height: 1.6;
                word-break: break-word;
                position: relative;
            }

            .bubble.you .bbody {
                background: var(--surf2);
                border: 1px solid var(--border2);
                border-radius: 14px 14px 4px 14px;
                color: var(--text);
            }

            .bubble.bmo .bbody {
                background: linear-gradient(135deg, rgba(79, 255, 176, 0.07), rgba(79, 255, 176, 0.03));
                border: 1px solid rgba(79, 255, 176, 0.18);
                border-radius: 14px 14px 14px 4px;
                color: var(--text);
            }
            .bubble.bmo .bbody::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                background: radial-gradient(ellipse at 0% 0%, rgba(79, 255, 176, 0.05), transparent 60%);
                pointer-events: none;
            }

            /* ── CONTROLS ── */
            #controls {
                background: var(--surface);
                border-top: 1px solid var(--border);
                padding: 18px 20px 24px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                position: relative;
            }
            #controls::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--accent2), transparent);
                opacity: 0.2;
            }

            #status {
                font-size: 12px;
                font-family: var(--mono);
                color: var(--muted);
                min-height: 18px;
                letter-spacing: 0.5px;
                transition: color 0.3s;
            }
            .state-recording #status {
                color: var(--red);
            }
            .state-processing #status {
                color: var(--amber);
            }
            .state-speaking #status {
                color: var(--accent);
            }
            .state-review #status {
                color: var(--blue);
            }

            /* ── MIC BUTTON ── */
            #mic-wrap {
                position: relative;
                width: 92px;
                height: 92px;
                display: grid;
                place-items: center;
            }

            .ring {
                position: absolute;
                border-radius: 50%;
                border: 1.5px solid transparent;
                pointer-events: none;
                transition:
                    border-color 0.3s,
                    opacity 0.3s;
            }
            .ring-a {
                width: 92px;
                height: 92px;
            }
            .ring-b {
                width: 74px;
                height: 74px;
            }

            .state-recording .ring {
                border-color: var(--red);
                animation: rpulse 0.85s ease-in-out infinite;
            }
            .state-recording .ring-b {
                animation-delay: 0.15s;
            }
            .state-processing .ring-b {
                border-color: var(--amber);
                border-top-color: transparent;
                animation: spin 0.8s linear infinite;
            }
            .state-processing .ring-a {
                border-color: rgba(255, 179, 71, 0.2);
                animation: rpulse 2s ease-in-out infinite;
            }
            .state-speaking .ring {
                border-color: var(--accent);
                animation: rpulse 0.65s ease-in-out infinite;
            }
            .state-speaking .ring-b {
                animation-delay: 0.1s;
            }

            @keyframes rpulse {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 0.6;
                }
                50% {
                    transform: scale(1.12);
                    opacity: 0.15;
                }
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            #mic-btn {
                width: 64px;
                height: 64px;
                border-radius: 50%;
                background: var(--surf2);
                border: 1.5px solid var(--border2);
                cursor: pointer;
                display: grid;
                place-items: center;
                position: relative;
                z-index: 1;
                transition:
                    background 0.2s,
                    border-color 0.2s,
                    transform 0.12s,
                    box-shadow 0.2s;
                color: var(--text2);
            }
            #mic-btn:hover:not(:disabled) {
                transform: scale(1.06);
                color: var(--text);
                border-color: var(--accent);
                box-shadow: 0 0 20px var(--accent-glow);
            }
            #mic-btn:active:not(:disabled) {
                transform: scale(0.94);
            }
            #mic-btn:disabled {
                cursor: default;
                opacity: 0.45;
            }

            .state-recording #mic-btn {
                background: var(--red-dim);
                border-color: var(--red);
                color: var(--red);
                box-shadow: 0 0 18px rgba(255, 77, 106, 0.2);
            }
            .state-processing #mic-btn {
                background: var(--amber-dim);
                border-color: var(--amber);
                color: var(--amber);
            }
            .state-speaking #mic-btn {
                background: var(--accent-dim);
                border-color: var(--accent);
                color: var(--accent);
                box-shadow: 0 0 18px var(--accent-glow);
            }

            /* review hide/show */
            #review-panel {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                width: 100%;
                max-width: 360px;
            }
            .state-review #mic-wrap {
                display: none;
            }
            .state-review #wave-wrap {
                display: none;
            }
            .state-review #review-panel {
                display: flex;
            }

            /* ── WAVE BARS ── */
            #wave-wrap {
                display: none;
                align-items: flex-end;
                gap: 3px;
                height: 28px;
            }
            .state-speaking #wave-wrap {
                display: flex;
            }

            .wb {
                width: 3px;
                border-radius: 2px;
                background: var(--accent);
                animation: wdance var(--d, 0.5s) ease-in-out infinite alternate;
                box-shadow: 0 0 6px rgba(79, 255, 176, 0.4);
            }
            @keyframes wdance {
                from {
                    height: 3px;
                    opacity: 0.25;
                }
                to {
                    height: 22px;
                    opacity: 0.9;
                }
            }

            /* ── TIMER ── */
            #timer {
                font-size: 12px;
                font-family: var(--mono);
                font-variant-numeric: tabular-nums;
                color: var(--red);
                min-height: 16px;
                opacity: 0;
                transition: opacity 0.2s;
                letter-spacing: 1px;
            }
            .state-recording #timer {
                opacity: 1;
            }

            /* ── REVIEW PANEL ── */
            #wf-canvas {
                width: 100%;
                height: 52px;
                background: var(--surf2);
                border: 1px solid var(--border2);
                border-radius: 8px;
                display: block;
            }

            .row {
                display: flex;
                gap: 8px;
                width: 100%;
            }

            .btn {
                flex: 1;
                padding: 10px 8px;
                border: none;
                border-radius: 8px;
                font-size: 12px;
                font-weight: 600;
                font-family: var(--sans);
                letter-spacing: 0.3px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                transition:
                    opacity 0.15s,
                    transform 0.1s,
                    box-shadow 0.15s;
            }
            .btn:hover {
                opacity: 0.88;
            }
            .btn:active {
                transform: scale(0.97);
            }
            .btn-ghost {
                background: var(--surf2);
                border: 1px solid var(--border2);
                color: var(--text2);
            }
            .btn-ghost:hover {
                color: var(--text);
                border-color: var(--text2);
            }
            .btn-send {
                background: linear-gradient(135deg, var(--accent2), var(--accent));
                color: #000;
                font-weight: 700;
                box-shadow: 0 0 14px var(--accent-glow);
            }
            .btn-send:hover {
                box-shadow: 0 0 22px rgba(79, 255, 176, 0.35);
            }
            .btn-play {
                flex: 0 0 auto;
                background: var(--surf3);
                border: 1px solid var(--border2);
                color: var(--text);
                padding: 10px 16px;
            }

            /* ── TERMINAL ── */
            #terminal {
                overflow: hidden;
                border-top: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                background: #050609;
                font-family: var(--mono);
                position: relative;
            }
            #terminal::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--purple), transparent);
                opacity: 0.35;
            }

            #term-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 6px 14px;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            #term-title {
                font-size: 9px;
                font-weight: 600;
                letter-spacing: 2.5px;
                text-transform: uppercase;
                color: var(--muted);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .term-dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--purple);
                box-shadow: 0 0 6px rgba(139, 124, 248, 0.5);
                animation: blink 2s ease-in-out infinite;
            }

            #term-clear {
                font-size: 9px;
                font-family: var(--mono);
                letter-spacing: 1px;
                text-transform: uppercase;
                color: var(--muted);
                background: none;
                border: 1px solid transparent;
                cursor: pointer;
                padding: 2px 8px;
                border-radius: 4px;
                transition:
                    color 0.15s,
                    border-color 0.15s,
                    background 0.15s;
            }
            #term-clear:hover {
                color: var(--text2);
                border-color: var(--border2);
                background: var(--surf2);
            }

            #term-log {
                flex: 1;
                overflow-y: auto;
                padding: 6px 0;
                font-size: 11px;
                line-height: 1.65;
            }
            #term-log::-webkit-scrollbar {
                width: 3px;
            }
            #term-log::-webkit-scrollbar-track {
                background: transparent;
            }
            #term-log::-webkit-scrollbar-thumb {
                background: var(--border2);
            }

            .tline {
                display: grid;
                grid-template-columns: 64px 18px 82px 1fr;
                gap: 0 8px;
                padding: 1px 14px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                animation: fade-row 0.1s ease;
                border-left: 2px solid transparent;
            }
            @keyframes fade-row {
                from {
                    opacity: 0;
                    transform: translateX(-4px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
            .tline:hover {
                background: rgba(255, 255, 255, 0.025);
            }

            .t-ts {
                color: var(--muted);
            }
            .t-dir {
                font-weight: 700;
            }
            .t-send .t-dir {
                color: var(--blue);
            }
            .t-recv .t-dir {
                color: var(--accent2);
            }

            .t-type {
                color: var(--text2);
            }
            .t-send .t-type {
                color: #4477cc;
            }
            .t-recv .t-type {
                color: var(--text2);
            }

            .t-filler .t-type {
                color: var(--amber);
            }
            .t-chunk .t-type {
                color: var(--accent2);
            }
            .t-transcript .t-type {
                color: var(--blue);
            }
            .t-reply .t-type {
                color: var(--accent);
            }
            .t-done .t-type {
                color: var(--muted);
            }
            .t-silence .t-type {
                color: var(--muted);
            }
            .t-error .t-type {
                color: var(--red);
            }
            .t-error {
                border-left-color: var(--red);
            }

            .t-payload {
                color: #3a3c60;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .t-filler .t-payload {
                color: #5a4a25;
            }
            .t-chunk .t-payload {
                color: #1e4532;
            }
            .t-transcript .t-payload,
            .t-reply .t-payload {
                color: #7a7ca0;
            }

            /* ── TERMINAL TOGGLE ── */
            #term-toggle {
                background: none;
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--muted);
                cursor: pointer;
                padding: 4px 10px;
                font-size: 10px;
                font-family: var(--mono);
                letter-spacing: 0.5px;
                display: flex;
                align-items: center;
                gap: 5px;
                transition:
                    color 0.15s,
                    border-color 0.15s,
                    background 0.15s;
            }
            #term-toggle:hover {
                color: var(--text2);
                border-color: var(--border2);
                background: var(--surf2);
            }
            body.term-open #term-toggle {
                color: var(--purple);
                border-color: rgba(139, 124, 248, 0.35);
                background: rgba(139, 124, 248, 0.06);
            }
        </style>
    </head>
    <body class="state-idle">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a4 4 0 0 1 4 4v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a4 4 0 0 1-8 0v-1H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1V6a4 4 0 0 1 4-4z" />
                        <circle cx="9" cy="10" r="1" fill="currentColor" />
                        <circle cx="15" cy="10" r="1" fill="currentColor" />
                    </svg>
                </div>
                BMO
            </div>
            <div class="header-right">
                <button id="term-toggle" title="Toggle socket log">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="4 17 10 11 4 5" />
                        <line x1="12" y1="19" x2="20" y2="19" />
                    </svg>
                    log
                </button>
                <div id="conn-badge">
                    <div class="cdot"></div>
                    <span id="conn-lbl">connecting</span>
                </div>
            </div>
        </header>

        <div id="chat">
            <div id="empty">
                <div class="empty-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <path d="M12 2a4 4 0 0 1 4 4v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a4 4 0 0 1-8 0v-1H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1V6a4 4 0 0 1 4-4z" />
                    </svg>
                </div>
                Say something to BMO<br />
                <strong>"Hey BMO, what's the weather?"</strong><br />
                <span>press <kbd>Space</kbd> or tap the mic</span>
            </div>
        </div>

        <div id="terminal">
            <div id="term-header">
                <div id="term-title">
                    <div class="term-dot"></div>
                    WebSocket Log
                </div>
                <button id="term-clear">clear</button>
            </div>
            <div id="term-log"></div>
        </div>

        <div id="controls">
            <div id="status">Connecting…</div>

            <div id="mic-wrap">
                <div class="ring ring-a"></div>
                <div class="ring ring-b"></div>
                <button id="mic-btn" title="Tap or hold Space">
                    <svg id="i-mic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="11" rx="3" />
                        <path d="M19 10a7 7 0 0 1-14 0" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                    <svg id="i-stop" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: none">
                        <rect x="4" y="4" width="16" height="16" rx="3" />
                    </svg>
                </button>
            </div>

            <div id="wave-wrap">
                <div class="wb" style="--d: 0.55s"></div>
                <div class="wb" style="--d: 0.72s; animation-delay: 0.08s"></div>
                <div class="wb" style="--d: 0.43s; animation-delay: 0.18s"></div>
                <div class="wb" style="--d: 0.65s; animation-delay: 0.04s"></div>
                <div class="wb" style="--d: 0.5s; animation-delay: 0.14s"></div>
                <div class="wb" style="--d: 0.38s; animation-delay: 0.22s"></div>
                <div class="wb" style="--d: 0.6s; animation-delay: 0.1s"></div>
                <div class="wb" style="--d: 0.45s; animation-delay: 0.28s"></div>
            </div>

            <div id="timer"></div>

            <div id="review-panel">
                <canvas id="wf-canvas"></canvas>
                <div class="row">
                    <button class="btn btn-play" id="btn-play">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21" /></svg>
                        Play
                    </button>
                    <button class="btn btn-ghost" id="btn-retake">Retake</button>
                    <button class="btn btn-send" id="btn-send">Send ↑</button>
                </div>
            </div>
        </div>

        <script>
            "use strict";

            // ── GAPLESS AUDIO QUEUE ──────────────────────────────────────────────────────
            class AudioQueue {
                constructor() {
                    this._actx = null;
                    this._next = 0;
                    this._chain = Promise.resolve();
                    this._srcs = [];
                }

                _ctx() {
                    if (!this._actx) this._actx = new (window.AudioContext || window.webkitAudioContext)();
                    if (this._actx.state === "suspended") this._actx.resume();
                    return this._actx;
                }

                enqueue(b64) {
                    this._chain = this._chain.then(async () => {
                        const ctx = this._ctx();
                        const bin = atob(b64);
                        const u8 = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                        let buf;
                        try {
                            buf = await ctx.decodeAudioData(u8.buffer);
                        } catch {
                            return;
                        }

                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        src.connect(ctx.destination);

                        const when = Math.max(ctx.currentTime + 0.04, this._next);
                        src.start(when);
                        this._next = when + buf.duration;
                        this._srcs.push(src);
                    });
                }

                reset() {
                    this._srcs.forEach((s) => {
                        try {
                            s.stop();
                        } catch {}
                    });
                    this._srcs = [];
                    this._next = 0;
                    this._chain = Promise.resolve();
                    if (this._actx) {
                        this._actx.close();
                        this._actx = null;
                    }
                }

                get isPlaying() {
                    return this._actx && this._next > this._actx.currentTime;
                }
            }

            // ── RECORDER ─────────────────────────────────────────────────────────────────
            class Recorder {
                constructor() {
                    this._wav = null;
                }

                async start(onTick) {
                    this._stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this._chunks = [];
                    this._mr = new MediaRecorder(this._stream);
                    this._mr.ondataavailable = (e) => e.data.size && this._chunks.push(e.data);
                    this._mr.start(80);
                    const t0 = Date.now();
                    this._tick = setInterval(() => onTick(((Date.now() - t0) / 1000).toFixed(1)), 100);
                }

                stop() {
                    clearInterval(this._tick);
                    return new Promise((resolve) => {
                        this._mr.onstop = async () => {
                            this._stream.getTracks().forEach((t) => t.stop());
                            const ab = await new Blob(this._chunks, { type: this._mr.mimeType }).arrayBuffer();
                            const dec = new AudioContext();
                            const buf = await dec.decodeAudioData(ab);
                            dec.close();
                            const rs = await this._resample(buf, 16000);
                            this._wav = this._toWav(rs);
                            resolve(this._wav);
                        };
                        this._mr.stop();
                    });
                }

                async _resample(buf, sr) {
                    const frames = Math.ceil(buf.duration * sr);
                    const off = new OfflineAudioContext(1, frames, sr);
                    const mono = off.createBuffer(1, buf.length, buf.sampleRate);
                    const dst = mono.getChannelData(0);
                    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
                        const src = buf.getChannelData(ch);
                        for (let i = 0; i < src.length; i++) dst[i] += src[i];
                    }
                    if (buf.numberOfChannels > 1) for (let i = 0; i < dst.length; i++) dst[i] /= buf.numberOfChannels;
                    const s = off.createBufferSource();
                    s.buffer = mono;
                    s.connect(off.destination);
                    s.start(0);
                    return off.startRendering();
                }

                _toWav(buf) {
                    const pcm = buf.getChannelData(0);
                    const sr = buf.sampleRate;
                    const ab = new ArrayBuffer(44 + pcm.length * 2);
                    const v = new DataView(ab);
                    const ws = (o, s) => {
                        for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
                    };
                    ws(0, "RIFF");
                    v.setUint32(4, 36 + pcm.length * 2, true);
                    ws(8, "WAVE");
                    ws(12, "fmt ");
                    v.setUint32(16, 16, true);
                    v.setUint16(20, 1, true);
                    v.setUint16(22, 1, true);
                    v.setUint32(24, sr, true);
                    v.setUint32(28, sr * 2, true);
                    v.setUint16(32, 2, true);
                    v.setUint16(34, 16, true);
                    ws(36, "data");
                    v.setUint32(40, pcm.length * 2, true);
                    for (let i = 0; i < pcm.length; i++) {
                        const s = Math.max(-1, Math.min(1, pcm[i]));
                        v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
                    }
                    return ab;
                }

                drawWaveform(canvas) {
                    if (!this._wav) return;
                    const dv = new DataView(this._wav);
                    const tot = (this._wav.byteLength - 44) / 2;
                    const W = (canvas.width = canvas.offsetWidth * devicePixelRatio);
                    const H = (canvas.height = canvas.offsetHeight * devicePixelRatio);
                    const ctx = canvas.getContext("2d");
                    ctx.clearRect(0, 0, W, H);
                    const grad = ctx.createLinearGradient(0, 0, W, 0);
                    grad.addColorStop(0, "rgba(79,255,176,.3)");
                    grad.addColorStop(0.5, "rgba(79,255,176,.9)");
                    grad.addColorStop(1, "rgba(79,255,176,.3)");
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.5 * devicePixelRatio;
                    ctx.beginPath();
                    for (let x = 0; x < W; x++) {
                        const idx = Math.floor((x / W) * tot);
                        const s = dv.getInt16(44 + idx * 2, true) / 32768;
                        const y = (0.5 - s * 0.43) * H;
                        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }

                get wav() {
                    return this._wav;
                }
            }

            // ── APP ──────────────────────────────────────────────────────────────────────
            const queue = new AudioQueue();
            const rec = new Recorder();

            let ws = null;
            let wsOk = false;
            let appState = "idle";

            const el = (id) => document.getElementById(id);
            const $chat = el("chat");
            const $empty = el("empty");
            const $status = el("status");
            const $micBtn = el("mic-btn");
            const $iMic = el("i-mic");
            const $iStop = el("i-stop");
            const $timer = el("timer");
            const $canvas = el("wf-canvas");
            const $badge = el("conn-badge");
            const $badgeLbl = el("conn-lbl");

            // ── WebSocket ──
            function connect() {
                const proto = location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${proto}//${location.host}/api/v1/ws/talk`);

                let _reconnTimer = null;

                function _scheduleReconnect() {
                    if (_reconnTimer) return;
                    _reconnTimer = setTimeout(() => {
                        _reconnTimer = null;
                        connect();
                    }, 3000);
                }

                ws.onopen = () => {
                    wsOk = true;
                    $badge.className = "ok";
                    $badgeLbl.textContent = "connected";
                    termLog("recv", "open", `ws://${location.host}/api/v1/ws/talk`);
                    setState("idle");
                };

                ws.onerror = () => {
                    wsOk = false;
                };

                ws.onclose = () => {
                    const wasOk = wsOk;
                    wsOk = false;
                    $badge.className = "err";
                    $badgeLbl.textContent = "reconnecting";
                    if (wasOk) termLog("recv", "close", "reconnecting in 3 s…");
                    setState("idle");
                    _scheduleReconnect();
                };

                ws.onmessage = ({ data }) => {
                    const msg = JSON.parse(data);
                    switch (msg.type) {
                        case "filler": {
                            const kb = msg.audio ? ((msg.audio.length * 0.75) / 1024).toFixed(1) : "?";
                            termLog("recv", "filler", `[audio  ${kb} kB]`);
                            queue.enqueue(msg.audio);
                            if (appState !== "processing") setState("processing");
                            break;
                        }

                        case "transcript":
                            termLog("recv", "transcript", `"${msg.text}"`);
                            addBubble("you", msg.text);
                            break;

                        case "reply":
                            termLog("recv", "reply", `"${msg.text}"`);
                            addBubble("bmo", msg.text);
                            break;

                        case "chunk": {
                            const kb = msg.audio ? ((msg.audio.length * 0.75) / 1024).toFixed(1) : "?";
                            termLog("recv", "chunk", `[audio  ${kb} kB]`);
                            queue.enqueue(msg.audio);
                            setState("speaking");
                            break;
                        }

                        case "silence":
                            termLog("recv", "silence", "");
                            waitDrain(() => setState("idle"));
                            break;

                        case "done":
                            termLog("recv", "done", "");
                            waitDrain(() => setState("idle"));
                            break;

                        case "error":
                            termLog("recv", "error", msg.message);
                            queue.reset();
                            setState("idle");
                            setLabel(`Error: ${msg.message}`);
                            break;
                    }
                };
            }

            let _drainTimer = null;
            function waitDrain(cb) {
                clearTimeout(_drainTimer);
                (function check() {
                    if (!queue.isPlaying) {
                        cb();
                        return;
                    }
                    _drainTimer = setTimeout(check, 150);
                })();
            }

            // ── State ──
            function setState(s) {
                appState = s;
                document.body.className = `state-${s}`;
                const labels = {
                    idle: "tap mic to speak",
                    recording: "recording — tap to stop",
                    review: "confirm or retake",
                    processing: "thinking",
                    speaking: "bmo is speaking",
                };
                setLabel(labels[s] || "");
                $micBtn.disabled = s === "processing" || s === "speaking";
                $iMic.style.display = s === "recording" ? "none" : "";
                $iStop.style.display = s === "recording" ? "" : "none";
            }

            function setLabel(t) {
                $status.innerHTML = appState === "processing" ? `${t}<span class="dots"></span>` : t;
            }

            document.head.insertAdjacentHTML(
                "beforeend",
                `<style>
.dots::after {
  content: '';
  animation: dot3 1.3s steps(3, end) infinite;
}
@keyframes dot3 {
  0%  { content: '.';   }
  33% { content: '..';  }
  66% { content: '...'; }
  99% { content: '';    }
}
</style>`,
            );

            // ── Mic button ──
            $micBtn.addEventListener("click", async () => {
                if (!wsOk) return;
                if (appState === "idle") {
                    try {
                        setState("recording");
                        await rec.start((t) => {
                            $timer.textContent = `${t}s`;
                        });
                    } catch {
                        setState("idle");
                        setLabel("mic access denied");
                    }
                } else if (appState === "recording") {
                    $timer.textContent = "";
                    setState("review");
                    await rec.stop();
                    rec.drawWaveform($canvas);
                }
            });

            // ── Review ──
            el("btn-play").addEventListener("click", () => {
                if (!rec.wav) return;
                const url = URL.createObjectURL(new Blob([rec.wav], { type: "audio/wav" }));
                const a = new Audio(url);
                a.onended = () => URL.revokeObjectURL(url);
                a.play();
            });

            el("btn-retake").addEventListener("click", () => {
                queue.reset();
                setState("idle");
            });

            el("btn-send").addEventListener("click", () => {
                if (!rec.wav || !wsOk) return;
                queue.reset();
                ws.send(rec.wav);
                setState("processing");
            });

            // ── Chat bubbles ──
            function addBubble(who, text) {
                $empty?.remove();
                const wrap = document.createElement("div");
                wrap.className = `bubble ${who}`;
                wrap.innerHTML = `
    <div class="blabel">${who === "you" ? "you" : "bmo"}</div>
    <div class="bbody">${text.replace(/</g, "&lt;")}</div>
  `;
                $chat.appendChild(wrap);
                $chat.scrollTop = $chat.scrollHeight;
            }

            // ── Keyboard shortcut ──
            document.addEventListener("keydown", (e) => {
                if (e.code === "Space" && !e.repeat && document.activeElement === document.body) {
                    e.preventDefault();
                    $micBtn.click();
                }
            });

            // ── Terminal ──────────────────────────────────────────────────────────────────
            const $termLog = el("term-log");
            const MAX_LINES = 120;

            el("term-toggle").addEventListener("click", () => {
                document.body.classList.toggle("term-open");
            });

            el("term-clear").addEventListener("click", () => {
                $termLog.innerHTML = "";
            });

            function termLog(dir, type, payload = "") {
                const now = new Date();
                const ts = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
                const arrow = dir === "send" ? "↑" : "↓";

                const row = document.createElement("div");
                row.className = `tline t-${dir} t-${type}`;
                row.innerHTML =
                    `<span class="t-ts">${ts}</span>` +
                    `<span class="t-dir">${arrow}</span>` +
                    `<span class="t-type">${type}</span>` +
                    `<span class="t-payload">${payload.replace(/</g, "&lt;")}</span>`;

                $termLog.appendChild(row);

                while ($termLog.children.length > MAX_LINES) $termLog.firstChild.remove();

                const d = $termLog;
                if (d.scrollHeight - d.scrollTop - d.clientHeight < 60) {
                    d.scrollTop = d.scrollHeight;
                }
            }

            // ── Start ──
            connect();

            const _origSend = ws.send.bind(ws);
            ws.send = function (data) {
                if (data instanceof ArrayBuffer) {
                    termLog("send", "audio", `[wav  ${(data.byteLength / 1024).toFixed(1)} kB]`);
                }
                return _origSend(data);
            };
        </script>
    </body>
</html>
