name: bmo-multi
# Same system as docker-compose.yml, but server/brain/Ollama are three
# separate images instead of one supervised monolith — useful for scaling
# brain and Go independently, or running brain on a GPU box and Go elsewhere.
# See docker-compose.yml for the single-image version; env vars here mirror
# it 1:1 except AI_HOST/OLLAMA_URL, which now point at service names instead
# of localhost.

services:
  server:
    build:
      context: ./server
    container_name: bmo-server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: password
      DB_NAME: bmo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_HOST: brain
      AI_PORT: 8000
    ports:
      - "4040:4040"
    depends_on:
      brain:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4040/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  brain:
    build:
      context: ./brain
    container_name: bmo-brain
    ports:
      - "8000:8000" # exposed here (unlike the single-image setup) for direct debugging
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      DATABASE_URL: postgresql://postgres:password@postgres:5432/bmo
      STT_PROVIDER: local
      WHISPER_MODEL: base
      TTS_PROVIDER: piper
      MINIO_ENDPOINT: storage:9000
      MINIO_ACCESS_KEY: bmo
      MINIO_SECRET_KEY: bmo_secret
      MINIO_BUCKET: bmo-audio
      MINIO_SECURE: "false"
      DEFAULT_WEATHER_LOCATION: London
      WAKE_WORD: ""
      LOG_LEVEL: alerts
    volumes:
      - whisper_cache:/app/data/whisper
      - xtts_cache:/app/data/xtts
      - kokoro_cache:/app/data/kokoro
      - ./brain/data/bmo_voice:/app/data/bmo_voice
      - ./brain/data/bmo:/app/data/bmo:ro
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 600s # first boot downloads the Whisper model

  ollama:
    image: ollama/ollama:latest
    container_name: bmo-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for the host's NVIDIA GPU (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: waits for ollama, pulls OLLAMA_DEFAULT_MODELS if missing, exits.
  # Pure HTTP (docker/bootstrap.sh) — no `ollama` CLI needed in this image.
  ollama-init:
    image: curlimages/curl:latest
    container_name: bmo-ollama-init
    volumes:
      - ./docker/bootstrap.sh:/bootstrap.sh:ro
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODELS: "llama3.2:1b"
    entrypoint: ["sh", "/bootstrap.sh"]
    depends_on:
      - ollama
    restart: "no"

  postgres:
    image: postgres:alpine
    container_name: bmo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bmo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:alpine
    container_name: bmo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: bmo-storage
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: bmo
      MINIO_ROOT_PASSWORD: bmo_secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  whisper_cache:
  xtts_cache:
  kokoro_cache:
  minio_data:
