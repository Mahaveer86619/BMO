; Runs all three halves of the monolith in one container: Ollama (local LLM
; inference), brain (the Python service — STT/NLP/tools/TTS/DB, from ../brain),
; and the Go hub (always connected to the Pico). See Dockerfile and
; docker/entrypoint.sh + bootstrap.sh.
;
; Debugging: `docker exec bmo-server supervisorctl status` shows each process's
; live state (RUNNING/FATAL/BACKOFF/etc.) — useful when `docker compose logs`
; alone doesn't make it obvious which of the three crashed.

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Every program's command is wrapped in `stdbuf ... | sed "s/^/[name] /"` so
; `docker compose logs bmo-server` — one combined stream for all three
; processes — stays greppable by which process said what.

[program:ollama]
command=sh -c '/usr/bin/ollama serve 2>&1 | stdbuf -oL sed "s/^/[ollama] /"'
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Runs once per container start, not a long-lived service: waits for ollama to
; come up, then pulls whatever's missing from OLLAMA_DEFAULT_MODELS. Persisted
; models (see the ollama_data volume in docker-compose.yml) mean this is a
; no-op after the first run.
[program:bmo-bootstrap]
command=sh -c '/app/docker/bootstrap.sh 2>&1 | stdbuf -oL sed "s/^/[bootstrap] /"'
autostart=true
autorestart=false
startsecs=0
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; brain's own entrypoint.sh pre-downloads Whisper/XTTS/Kokoro models into
; their volumes on first run (skipped on subsequent starts via marker files),
; then execs uvicorn on 0.0.0.0:8000 — not exposed outside the container since
; no port mapping publishes it, only reachable from Go over localhost.
[program:bmo-brain]
command=sh -c '/app/brain/entrypoint.sh 2>&1 | stdbuf -oL sed "s/^/[brain] /"'
directory=/app/brain
autostart=true
autorestart=true
priority=10
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bmo-server]
command=sh -c '/app/bmo-server 2>&1 | stdbuf -oL sed "s/^/[bmo-server] /"'
autostart=true
autorestart=true
priority=20
startretries=10
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
