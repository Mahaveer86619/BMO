name: bmo

services:

  # ── BMO brain server ─────────────────────────────────────────────────────────
  brain:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/app/data/whisper
      - xtts_cache:/app/data/xtts
      - kokoro_cache:/app/data/kokoro
      - ./data/bmo_voice:/app/data/bmo_voice
      - ./data/bmo:/app/data/bmo:ro
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - PIPER_MODEL_PATH=/opt/piper-models/en_GB-alan-low.onnx
      - XTTS_REFERENCE_AUDIO=/app/data/bmo_voice/reference.wav
      - XTTS_CACHE_DIR=/app/data/xtts
      - WHISPER_MODEL_CACHE=/app/data/whisper
      - COSYVOICE_REFERENCE_AUDIO=/app/data/bmo_voice/reference.wav
      - KOKORO_CACHE_DIR=/app/data/kokoro
      - COQUI_TOS_AGREED=1
      - HF_TOKEN=${HF_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=bmo
      - POSTGRES_PASSWORD=bmo_pass
      - POSTGRES_DB=bmo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmo -d bmo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (audio storage) ────────────────────────────────────────────────────
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-bmo}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-bmo_secret}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (local LLM) — optional ────────────────────────────────────────────
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── CosyVoice TTS service — optional ─────────────────────────────────────────
  cosyvoice:
    profiles: ["cosyvoice"]
    build:
      context: ./cosyvoice
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    ports:
      - "50000:50000"
    environment:
      - COSYVOICE_MODEL=${COSYVOICE_MODEL:-CosyVoice2-0.5B}
      - COSYVOICE_HF_REPO=${COSYVOICE_HF_REPO:-FunAudioLLM/CosyVoice2-0.5B}
      - COSYVOICE_PORT=50000
      - HF_TOKEN=${HF_API_TOKEN:-}
    volumes:
      - cosyvoice_models:/models
    # Uncomment for NVIDIA GPU (requires nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50000/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s


volumes:
  whisper_cache:
  xtts_cache:
  kokoro_cache:
  postgres_data:
  minio_data:
  ollama_data:
  cosyvoice_models:
